
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: blogreact-eks
  region: ap-south-1

iam:
  withOIDC: true

vpc:
  nat:
    gateway: Disable
  clusterEndpoints:
    publicAccess: true
    privateAccess: true

managedNodeGroups:
  - name: blogreact-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: false
    volumeSize: 20
